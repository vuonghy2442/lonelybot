workspace = { members = ["lonecli"] }
[package]
name = "lonelybot"
version = "0.2.3"
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lonelybot"
path = "src/lib.rs"
crate-type = ["lib"]

[features]
hop_debug = []

[dependencies]
rand = { version = "0.10.2", default-features = false }
rand_mt = "6.0.3"
arrayvec = { version = "0.7.8", default-features = false }
hashbrown = { version = "0.17.1", default-features = false }
static_assertions = "1.1.0"
uint = { version = "0.10.1", default-features = false }

[dev-dependencies]
criterion = "0.8.2"


[profile.release]
lto = true

[profile.release-with-debug]
inherits = "release"
debug = true

[profile.dev]
opt-level = 0
lto = "thin"

[[bench]]
name = "gen_moves"
harness = false
